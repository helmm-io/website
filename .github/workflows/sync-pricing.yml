name: Sync pricing from Google Sheet

# Regenerates site/quoteData.jsx from the "HELM Licensing & Pricing Reference"
# Google Sheet on a schedule, and commits+pushes it if anything changed. A
# push to main from this workflow triggers deploy.yml automatically, same as
# any other push — that's what actually gets a price change live.
#
# See scripts/sync_pricing_sheet.py for the sync/validation logic and
# README.md's "Live pricing sync" section for the full setup (service
# account, sheet sharing, secrets).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: sync-pricing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PRICING_SHEET_ID: ${{ secrets.PRICING_SHEET_ID }}
        run: python scripts/sync_pricing_sheet.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- site/quoteData.jsx; then
            echo "no pricing changes"
            exit 0
          fi
          git config user.name "helm-pricing-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add site/quoteData.jsx
          git commit -m "Sync pricing from Google Sheet"
          git push
