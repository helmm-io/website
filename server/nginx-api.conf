# Installed to /etc/nginx/default.d/ (server context) by server/install.sh

# Branded 404 page. No "=" status override, so the real 404 status code is
# preserved — only the body is replaced. 404.html itself must always resolve
# (it's excluded from deploy.sh's strip list), so this can't loop.
error_page 404 /404.html;

# Launch party invite — accept any capitalisation of "launchparty" and send it
# to the canonical, correctly-cased /launchParty/ (the on-disk folder name;
# Linux/nginx filesystem lookups are case-sensitive). The "^~" guard below
# matches the real folder first and skips regex checking entirely, so the
# correctly-cased path is never re-matched by the case-insensitive rules that
# follow — without it, a request for the canonical URL would match its own
# redirect target and loop.
location ^~ /launchParty/ {
}
location ~* ^/launchparty$ {
    return 301 https://$host/launchParty/$is_args$args;
}
location ~* ^/launchparty/(.*)$ {
    return 301 https://$host/launchParty/$1$is_args$args;
}

# HubSpot proxy — dynamic endpoint for lead/quote capture
location = /api/hubspot {
    limit_req zone=helm_hubspot burst=10 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header X-Real-IP $remote_addr;
}

# Claude proxy — backs the "Beat my invoice" tool. Tightly rate-limited, and
# given a longer read timeout than nginx's 60s default since LLM calls run
# slower than a typical API round trip.
location = /api/claude {
    limit_req zone=helm_claude burst=2 nodelay;
    client_max_body_size 24k;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header X-Real-IP $remote_addr;
}

# Markup and code change on every deploy, so keep their TTL short. Without this
# nginx sends no Cache-Control at all and Cloudflare falls back to its 4-hour
# Browser Cache TTL, which left stale JS in browsers long after a deploy.
# (Cloudflare only forwards these to the browser when the zone's Browser Cache
# TTL is set to "Respect Existing Headers".)
location ~* \.(?:html|js|jsx|css|json)$ {
    expires 5m;
}

# Never serve hidden files (.git etc.) from the web root
location ~ /\. {
    deny all;
}
