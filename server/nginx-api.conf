# Installed to /etc/nginx/default.d/ (server context) by server/install.sh

# HubSpot proxy — dynamic endpoint for lead/quote capture
location = /api/hubspot {
    limit_req zone=helm_hubspot burst=10 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header X-Real-IP $remote_addr;
}

# Claude proxy — backs the "Beat my invoice" tool. Tightly rate-limited, and
# given a longer read timeout than nginx's 60s default since LLM calls run
# slower than a typical API round trip.
location = /api/claude {
    limit_req zone=helm_claude burst=2 nodelay;
    client_max_body_size 24k;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header X-Real-IP $remote_addr;
}

# Markup and code change on every deploy, so keep their TTL short. Without this
# nginx sends no Cache-Control at all and Cloudflare falls back to its 4-hour
# Browser Cache TTL, which left stale JS in browsers long after a deploy.
# (Cloudflare only forwards these to the browser when the zone's Browser Cache
# TTL is set to "Respect Existing Headers".)
location ~* \.(?:html|js|jsx|css|json)$ {
    expires 5m;
}

# Never serve hidden files (.git etc.) from the web root
location ~ /\. {
    deny all;
}
