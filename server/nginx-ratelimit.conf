# Installed to /etc/nginx/conf.d/ (http context) by server/install.sh
limit_req_zone $binary_remote_addr zone=helm_hubspot:1m rate=10r/m;

# Claude calls cost real money per request, so this is deliberately tighter
# than the HubSpot zone above.
limit_req_zone $binary_remote_addr zone=helm_claude:1m rate=5r/m;
